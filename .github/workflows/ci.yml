name: Build & Test CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Geospatial Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python Syntax of All Modules
        run: |
          python -m py_compile run_phase1.py run_phase3.py train_segmentation.py app.py generate_sample_data.py generate_sample_patches.py

      - name: Run Sample Data Generation
        run: |
          python generate_sample_data.py
          python generate_sample_patches.py

      - name: Run Phase 3 Attribution Verification
        run: |
          python run_phase3.py --ais-path data/sample_ais.csv --threshold-km 25.0
